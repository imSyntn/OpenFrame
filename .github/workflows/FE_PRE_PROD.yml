name: FE PRE PROD TEST, BUILD & DEPLOY
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
  push:
    branches: ["pre-prod"]
    paths:
      - "apps/web/**"
      - "packages/**"

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @workspace/schema run build
          pnpm --filter @workspace/constants run build

      - name: Upload package builds
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-builds
          path: |
            packages/schema/dist
            packages/constants/dist

      - name: Run linter
        run: pnpm --filter frontend run lint

      - name: Run typecheck
        run: pnpm --filter frontend run typecheck

      - name: Run test
        run: pnpm --filter frontend run test

  deploy-preview:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download package builds
        uses: actions/download-artifact@v4
        with:
          name: frontend-package-builds

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        working-directory: apps/web
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifacts
        working-directory: apps/web
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview
        working-directory: apps/web
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
